<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ時計">
<title>筋トレ時計</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --track: #e2e4e8;
    --mark: #b4b9c1;
    --accent: #2457c5;
    --accent-text: #ffffff;
    --warn: #e0621b;
    --chime: #d1242f;
    --btn: #ebedf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #1b1e22;
      --text: #eef0f2;
      --muted: #9aa1aa;
      --track: #2a2e34;
      --mark: #4a5058;
      --accent: #5b8def;
      --accent-text: #ffffff;
      --warn: #ff8a3d;
      --chime: #ff5a5f;
      --btn: #2a2e34;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .app {
    max-width: 720px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 16px 0;
  }

  /* 時計 */
  .dial { position: relative; width: min(100%, 62vh, 560px); aspect-ratio: 1; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .mark { stroke: var(--mark); stroke-linecap: round; transition: stroke .15s; }
  .mark.major { stroke-width: 3; }
  .mark.minor { stroke-width: 1.5; }
  .mark.on { stroke: var(--accent); }
  .mark.last { stroke: var(--warn); }
  .track { fill: none; stroke: var(--track); stroke-width: 10; }
  .progress { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
  .dot { fill: var(--accent); }
  .dial.warn .progress, .dial.warn .dot { stroke: var(--warn); fill: var(--warn); }
  .dial.warn .progress { fill: none; }
  .flash { fill: var(--chime); opacity: 0; }
  .flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { opacity: .22; } 100% { opacity: 0; } }

  .readout {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; pointer-events: none;
  }
  .time {
    font-size: clamp(56px, 15vmin, 132px); font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .time .colon { opacity: 1; transition: opacity .2s; }
  .paused .time .colon { opacity: .25; }
  .status { font-size: clamp(14px, 2.6vmin, 20px); color: var(--muted); min-height: 1.4em; }
  .paused .status { color: var(--warn); }

  /* ボタン */
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(100%, 520px); }
  button {
    font: inherit; color: var(--text); background: var(--btn);
    border: none; border-radius: 14px; padding: 18px 8px; cursor: pointer;
    font-size: 19px; font-weight: 600; touch-action: manipulation;
  }
  button:active { filter: brightness(.9); }
  button:disabled { opacity: .3; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); }

  /* 設定 */
  .settings {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 12px 24px; color: var(--muted); font-size: 15px; width: min(100%, 520px);
  }
  .settings label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .settings input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  .settings input[type=range] { width: 140px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin: 0; opacity: .8; }
  a.back { color: var(--muted); font-size: 13px; }

  .side { display: contents; }

  /* 横向きの iPad では時計とボタンを左右に */
  @media (orientation: landscape) and (min-width: 900px) {
    .app { max-width: 1100px; flex-direction: row; gap: 48px; }
    .dial { width: min(60vw, 82vh, 640px); }
    .side { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 340px; }
    .controls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="dial" id="dial">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle class="flash" id="flash" cx="150" cy="150" r="148"/>
      <g id="marks"></g>
      <circle class="track" cx="150" cy="150" r="118"/>
      <circle class="progress" id="progress" cx="150" cy="150" r="118" transform="rotate(-90 150 150)"/>
      <circle class="dot" id="dot" cx="150" cy="32" r="9"/>
    </svg>
    <div class="readout">
      <div class="time" id="time" role="timer" aria-live="off">00<span class="colon">:</span>00</div>
      <div class="status" id="status">スタートを押してください</div>
    </div>
  </div>

  <div class="side">
    <div class="controls">
      <button class="primary" id="start">スタート</button>
      <button id="pause" disabled>一時停止</button>
      <button id="stop" disabled>ストップ</button>
    </div>
    <div class="settings">
      <label><input type="checkbox" id="tickOn" checked> 毎秒の音</label>
      <label><input type="checkbox" id="signalOn" checked> 時報（57〜00秒）</label>
      <label>音量 <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8"></label>
    </div>
    <p class="hint">スペース: スタート／一時停止　Esc: ストップ<br>
      iPhone/iPad は消音スイッチ・音量ボタンもご確認ください</p>
    <a class="back" href="./">← 数独へ</a>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 表示の準備 ----------
  const R = 118, C = 2 * Math.PI * R;
  const $ = id => document.getElementById(id);
  const dial = $('dial'), timeEl = $('time'), statusEl = $('status');
  const progress = $('progress'), dot = $('dot'), flash = $('flash');
  const startBtn = $('start'), pauseBtn = $('pause'), stopBtn = $('stop');
  const tickOn = $('tickOn'), signalOn = $('signalOn'), volume = $('volume');

  progress.setAttribute('stroke-dasharray', `0 ${C}`);

  const marks = [];
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * 2 * Math.PI;
    const major = i % 5 === 0;
    const r1 = 136, r2 = major ? 148 : 144;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 150 + r1 * Math.sin(a));
    l.setAttribute('y1', 150 - r1 * Math.cos(a));
    l.setAttribute('x2', 150 + r2 * Math.sin(a));
    l.setAttribute('y2', 150 - r2 * Math.cos(a));
    l.setAttribute('class', 'mark ' + (major ? 'major' : 'minor'));
    $('marks').appendChild(l);
    marks.push(l);
  }

  // ---------- 設定の保存 ----------
  const KEY = 'workoutTimer2.settings';
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof s.tick === 'boolean') tickOn.checked = s.tick;
    if (typeof s.signal === 'boolean') signalOn.checked = s.signal;
    if (typeof s.volume === 'number') volume.value = s.volume;
  } catch (e) {}
  function saveSettings() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        tick: tickOn.checked, signal: signalOn.checked, volume: +volume.value
      }));
    } catch (e) {}
  }

  // ---------- 音 ----------
  let ctx = null, master = null;
  const scheduled = new Set();

  function initAudio() {
    // iOS の消音スイッチ中でも鳴らす（Safari 17+）
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = +volume.value;
      master.connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume();
  }

  // 1音を鳴らす。when は AudioContext の時刻
  function tone(when, freq, dur, peak, type = 'sine') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.004);
    g.gain.setValueAtTime(peak, when + Math.max(0.004, dur * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(master);
    osc.start(when);
    osc.stop(when + dur + 0.02);
    const item = { osc, when };
    scheduled.add(item);
    osc.onended = () => scheduled.delete(item);
  }

  // 毎秒: 控えめなクリック音
  const tick = when => tone(when, 1600, 0.035, 0.25, 'triangle');
  // 時報の予報音: NHK と同じ 440Hz・0.1秒
  const pip = when => tone(when, 440, 0.1, 0.7);
  // 時報の正報音: 880Hz を約3秒かけて減衰
  function chime(when) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.8, when + 0.005);
    g.gain.setValueAtTime(0.8, when + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 3);
    osc.connect(g).connect(master);
    osc.start(when);
    osc.stop(when + 3.05);
    const item = { osc, when };
    scheduled.add(item);
    osc.onended = () => scheduled.delete(item);
  }
  // スタートの合図
  const startCue = when => { tone(when, 880, 0.12, 0.6); };

  function cancelFutureSounds() {
    if (!ctx) return;
    const now = ctx.currentTime;
    for (const item of scheduled) {
      if (item.when > now) { try { item.osc.stop(); } catch (e) {} scheduled.delete(item); }
    }
  }

  // ---------- 計時 ----------
  // state: idle | running | paused
  let state = 'idle';
  let accMs = 0;        // 一時停止までに経過した時間
  let startPerf = 0;    // 現在の走行区間の開始時刻（performance.now）
  let nextSec = 0;      // 次に音を予約する経過秒
  let schedTimer = null, raf = null, wakeLock = null;

  const elapsed = () => state === 'running' ? accMs + (performance.now() - startPerf) : accMs;

  const LOOKAHEAD = 150; // ms 先まで音を予約する

  function schedule() {
    const e = elapsed();
    while (nextSec * 1000 - e < LOOKAHEAD) {
      const delay = nextSec * 1000 - e;
      // バックグラウンドから戻った時などに過去の音をまとめて鳴らさない
      if (delay > -60) {
        const when = ctx.currentTime + Math.max(0, delay) / 1000;
        const s = nextSec % 60;
        if (nextSec === 0) startCue(when);
        else if (signalOn.checked && s === 0) { chime(when); setTimeout(doFlash, Math.max(0, delay)); }
        else if (signalOn.checked && s >= 57) pip(when);
        else if (tickOn.checked) tick(when);
      }
      nextSec++;
    }
  }

  function doFlash() {
    flash.classList.remove('go');
    void flash.getBoundingClientRect();
    flash.classList.add('go');
  }

  const pad = n => String(n).padStart(2, '0');

  function render() {
    const e = elapsed();
    const totalSec = Math.floor(e / 1000);
    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    timeEl.innerHTML = `${pad(m)}<span class="colon">:</span>${pad(s)}`;

    // 外周: 1分で1周（なめらかに）
    const frac = (e % 60000) / 60000;
    progress.setAttribute('stroke-dasharray', `${frac * C} ${C}`);
    const a = frac * 2 * Math.PI;
    dot.setAttribute('cx', 150 + R * Math.sin(a));
    dot.setAttribute('cy', 150 - R * Math.cos(a));

    const lit = state === 'idle' ? -1 : s;
    for (let i = 0; i < 60; i++) {
      marks[i].classList.toggle('on', i <= lit && i < 57);
      marks[i].classList.toggle('last', i <= lit && i >= 57);
    }
    dial.classList.toggle('warn', state !== 'idle' && s >= 57);
  }

  function loop() {
    render();
    raf = requestAnimationFrame(loop);
  }

  function setState(next) {
    state = next;
    startBtn.disabled = state === 'running';
    startBtn.textContent = state === 'paused' ? '再開' : 'スタート';
    pauseBtn.disabled = state !== 'running';
    stopBtn.disabled = state === 'idle';
    dial.classList.toggle('paused', state === 'paused');
    document.body.classList.toggle('paused', state === 'paused');
    statusEl.textContent = { idle: 'スタートを押してください', running: '', paused: '一時停止中' }[state];
  }

  function start() {
    if (state === 'running') return;
    initAudio();
    if (state === 'idle') { accMs = 0; nextSec = 0; }
    else {
      // 再開: 一時停止した瞬間の次の秒から鳴らす
      nextSec = Math.floor(accMs / 1000) + 1;
    }
    startPerf = performance.now();
    setState('running');
    schedule();
    schedTimer = setInterval(schedule, 25);
    if (!raf) loop();
    requestWakeLock();
  }

  function pause() {
    if (state !== 'running') return;
    accMs = elapsed();
    setState('paused');
    clearInterval(schedTimer);
    cancelFutureSounds();
    cancelAnimationFrame(raf); raf = null;
    render();
  }

  function stop() {
    if (state === 'idle') return;
    clearInterval(schedTimer);
    cancelFutureSounds();
    cancelAnimationFrame(raf); raf = null;
    accMs = 0;
    setState('idle');
    render();
    releaseWakeLock();
  }

  // ---------- 画面スリープ防止 ----------
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state !== 'idle') {
      requestWakeLock();
      if (ctx && ctx.state !== 'running') ctx.resume();
    }
  });

  // ---------- 操作 ----------
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  stopBtn.addEventListener('click', stop);
  tickOn.addEventListener('change', saveSettings);
  signalOn.addEventListener('change', saveSettings);
  volume.addEventListener('input', () => {
    if (master) master.gain.value = +volume.value;
    saveSettings();
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); state === 'running' ? pause() : start(); }
    else if (e.key === 'Escape') stop();
  });

  setState('idle');
  render();
})();
</script>
</body>
</html>
